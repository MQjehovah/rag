version: '2.2'

services:
  db:
    image: pgvector/pgvector:pg16
    profiles:
      - pg
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
        required: false

  source-worker:
    build: ./backend
    command: ["python", "scripts/source_worker.py"]
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
        required: false

  frontend:
    build: ./frontend
    ports:
      - "8092:80"
    depends_on:
      - backend

volumes:
  pgdata:
