[pytest]
# 临时目录重定向在 tests/conftest.py 导入阶段完成（Windows %TEMP% 权限问题）。
# 如需手动覆盖：TEMP=<可写目录> TMP=<可写目录> python -m pytest ...
python_files = test_*.py
addopts = -p no:cacheprovider
# 排除非测试目录。注意：norecursedirs 会替换 pytest 默认值，故需显式保留 `.*`
# （隐藏目录，如 .pytest_cache / .pytest_runtime 等）。tmp 为历史遗留
# （含 ACL 拒绝访问目录，会中断收集）；.venv 含第三方库 test_*.py。
norecursedirs = .* tmp .venv data reports eval
